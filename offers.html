<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers — DaCam</title>
    <meta name="description" content="Exclusive deals and discounts on professional photography equipment at DaCam. Shop our best offers on cameras, lenses, and accessories.">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <style>
        /* ── Offers page extras ───────────────────────────── */

        /* Hero banner */
        .offers-hero {
            width: min(100% - clamp(2rem, 7vw, 8rem), 90rem);
            margin: clamp(1.5rem, 4vw, 3rem) auto clamp(1rem, 2.5vw, 2rem);
            padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1.5rem, 4vw, 3rem);
            background: linear-gradient(135deg, var(--ink) 0%, #2a3d33 60%, #1a2e24 100%);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-raised);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(1rem, 3vw, 2rem);
            overflow: hidden;
            position: relative;
        }

        .offers-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 80% 50%, rgb(199 240 90 / .12) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgb(255 110 66 / .08) 0%, transparent 50%);
            pointer-events: none;
        }

        .offers-hero__text {
            position: relative;
            z-index: 1;
        }

        .offers-hero__tag {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .3rem .75rem;
            background: rgb(199 240 90 / .15);
            border: 1px solid rgb(199 240 90 / .35);
            border-radius: 999px;
            color: var(--brand);
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: .85rem;
        }

        .offers-hero__tag::before {
            content: "";
        }

        .offers-hero__title {
            margin: 0 0 .5rem;
            font-size: clamp(1.6rem, 4vw, 2.8rem);
            font-weight: 800;
            color: #fff;
            letter-spacing: -.05em;
            line-height: 1.1;
        }

        .offers-hero__title span {
            color: var(--brand);
        }

        .offers-hero__sub {
            margin: 0;
            color: rgb(255 253 248 / .65);
            font-size: clamp(.78rem, 1.5vw, .95rem);
            max-width: 36rem;
        }

        .offers-hero__badge {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: clamp(7rem, 14vw, 10rem);
            height: clamp(7rem, 14vw, 10rem);
            border-radius: 50%;
            background: var(--brand);
            box-shadow: 0 0 0 6px rgb(199 240 90 / .2);
            color: var(--ink);
            text-align: center;
            line-height: 1.1;
            animation: pulse-badge 2.4s ease-in-out infinite;
        }

        .offers-hero__badge strong {
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: -.06em;
        }

        .offers-hero__badge span {
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            opacity: .75;
        }

        @keyframes pulse-badge {
            0%, 100% { box-shadow: 0 0 0 6px rgb(199 240 90 / .2); }
            50%       { box-shadow: 0 0 0 14px rgb(199 240 90 / .08); }
        }

        /* Offer badge on cards */
        .producto--oferta {
            position: relative;
        }

        .oferta-badge {
            position: absolute;
            top: .65rem;
            left: .65rem;
            z-index: 2;
            padding: .2rem .6rem;
            background: var(--accent);
            color: #fff;
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
            border-radius: var(--radius-sm);
            box-shadow: 0 2px 8px rgb(255 110 66 / .45);
            pointer-events: none;
        }

        /* Precio original tachado */
        .producto__precio--original {
            text-decoration: line-through;
            color: var(--ink-soft);
            font-size: .72rem;
            font-weight: 600;
        }

        /* Precio de oferta */
        .precio-oferta-valor {
            color: var(--accent);
        }

        /* Ahorro */
        .precio-ahorro {
            display: block;
            font-size: .68rem;
            font-weight: 700;
            color: var(--brand-deep);
            margin-top: .1rem;
        }

        /* Stats bar */
        .offers-stats {
            width: min(100% - clamp(2rem, 7vw, 8rem), 90rem);
            margin: 0 auto clamp(1rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            gap: clamp(.75rem, 2vw, 1.5rem);
            flex-wrap: wrap;
        }

        .offers-stats__item {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .78rem;
            font-weight: 700;
            color: var(--ink-soft);
        }

        .offers-stats__dot {
            width: .5rem;
            height: .5rem;
            border-radius: 50%;
            background: var(--brand-deep);
            flex-shrink: 0;
        }

        #offer-count {
            color: var(--ink);
        }
    </style>
</head>

<body>

            <img src="images/DaCam.png" alt="logo">

            <button id="search" type="button" aria-label="Search"><img src="svgs/search-alt-1-svgrepo-com.svg"
                    alt=""></button>
            <ul class="nav">
                <li>
                    <a href="index.html">Home</a>

                <li>
                <li>

    <h1 style="width: min(100% - clamp(2rem, 7vw, 8rem), 90rem); margin: clamp(1.5rem, 4vw, 3rem) auto clamp(.5rem, 1vw, 1rem);">Offers</h1>

    <!-- Stats bar -->
    <div class="offers-stats">
        <div class="offers-stats__item">
            <span class="offers-stats__dot"></span>
            <span id="offer-count">Loading...</span> products on sale

        <div class="offers-stats__item">
            <span class="offers-stats__dot" style="background:var(--accent)"></span>

    </div>

    <div class="productsContainer">
        <div id="filters">
            <label for="ordenar">Order by</label>
            <select name="ordenar" id="filter" onchange="ordenarProd(this.value)">

                <option value="menor-descuento">Smallest Discount</option>
                <option value="precio-mayor">Price: Highest to Lowest</option>
                <option value="precio-menor">Price: Lowest to Highest</option>
            </select>
        </div>
        <div id="products"></div>
        <div id="pagination"></div>
    </div>

</body>

</html>
