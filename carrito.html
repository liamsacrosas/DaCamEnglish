<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart — DaCam</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <a class="logo" href="index.html">
            <img src="images/DaCam.png" alt="logo">
            <p>DaCam</p>
        </a>
        <div class="options">
            <button id="search" type="button" aria-label="Search"><img src="svgs/search-alt-1-svgrepo-com.svg"
                    alt=""></button>
            <ul class="nav">
                <li>
                    <a href="products.html">Products</a>
                </li>
                <li>
                    <a href="servicios.html">Services</a>
                </li>
                <li>
                    <a href="offers.html">Offers</a>
                </li>
                <li>
                    <a href="contacto.html">Contact</a>
                </li>
            </ul>
            <button id="login" type="button" aria-label="Log in" onclick="window.location.href='logins/email.html'"><img src="svgs/person-svgrepo-com.svg"
                    alt=""></button>
            <button id="cart" type="button" aria-label="Shopping Cart" onclick="window.location.href='carrito.html'"><img
                    src="svgs/cart-shopping-svgrepo-com.svg" alt=""></button>
        </div>
    </header>

    <main class="carrito-page">
        <div class="carrito-header-title">
            <h1>Shopping Cart</h1>
        </div>

        <div class="carrito-layout">
            <section class="carrito-grid" id="carritoGrid">
                <!-- Product cards reusing .producto -->
            </section>

            <aside class="carrito-resumen">
                <h2>Order Summary</h2>

                <div class="resumen-filas" id="resumenFilas"></div>

                <div class="resumen-fila-envio" style="display:flex; justify-content:space-between; align-items:center; padding:.6rem 0; border-top:1px dashed var(--line); margin-top:.5rem; font-size:.88rem;">
                    <span>Shipping Fee</span>
                    <span id="envioPrecio" style="font-weight:700;">$0</span>
                </div>

                <div class="resumen-total">
                    <span>Total</span>
                    <strong id="totalPrecio">$0</strong>
                </div>

                <div id="tarjetaStatus"></div>

                <button id="btnComprar" type="button" class="btn-comprar-cart" onclick="realizarCompra()">
                    Buy Now
                </button>
            </aside>
        </div>
    </main>

    <footer>
        <div class="footer-info">
            <p>DaCam 2026© All rights Reserved</p>
            <span class="footer-slogan">Capture daily moments with professional quality.</span>
        </div>
        <div class="footer-links">
            <a href="https://www.instagram.com/dacamoficial/" target="_blank" rel="noopener noreferrer" class="instagram-link">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align: middle; margin-right: 4px;">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
                Instagram (@dacamoficial)
            </a>
            <a href="#">Privacy Politics</a>
        </div>
    </footer>

    <script src="scripts/carrito.js"></script>
    <script src="scripts/search.js"></script>
</body>

</html>
