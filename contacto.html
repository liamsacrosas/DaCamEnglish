<div id="contenido">
  <main class="contacto">
    <section class="contacto__intro">
      <h1>Contact us</h1>
      <p>Tell us any questions you may have without obligation, or finalize a purchase or service with our help.</p>
    </section>

    <form id="contactForm" novalidate>
      <label>Full Name
        <input id="nombre" type="text" placeholder="John Doe">
      </label>

      <label>E-mail
        <input id="mail" type="email" placeholder="dacamsolutions@example.com">
      </label>

      <label>Phone Number (Optional)
        <input id="telefono" type="tel" placeholder="+12 345 678-9100">
      </label>

      <label>Subject
        <input id="asunto" type="text" placeholder="Rental, purchase, service, etc.">
      </label>

      <label>Description
        <textarea id="descripcion" placeholder="I need to rent a specific set of cameras"></textarea>
      </label>

      <button type="submit">Send</button>
      <p id="mensaje"></p>
    </form>
  </main>
</div>

  <footer>
    <p>DaCam 2026© All rights Reserved</p>
    <a>Privacy Politics</a>
  </footer>
